name: school_secretariat_app
description: "نظام إدارة أمانة السر المدرسية الثانوية"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  csv: ^6.0.0
  url_launcher: ^6.3.0
  pdf: ^3.10.8
  printing: ^5.13.1
  cupertino_icons: ^1.0.8
  firebase_core: ^4.13.0
  cloud_firestore: ^6.8.0
  firebase_auth: ^6.5.7
