  sqflite_sqlcipher: ^3.1.0
  flutter_secure_storage: ^9.0.0

  # التصدير والـ QR Code
  pdf: ^3.10.8
  excel: ^4.0.3
  qr_flutter: ^4.1.0

  # الأدوات المساعدة
  csv: ^6.0.0